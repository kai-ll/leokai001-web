<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Coin Flip — StepPot</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#e8f5f0;color:#1a3a2f;min-height:100vh;overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.app{width:100%;max-width:420px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;background:#F7F9FB}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(255,255,255,.95);border-bottom:1px solid rgba(0,180,130,.1);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
.hdr-l{display:flex;align-items:center;gap:9px}
.hdr-ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#00bfa5,#009688);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,191,165,.3)}
.hdr-t{font-size:14px;font-weight:800;color:#1a3a2f;line-height:1.2}
.hdr-sub{font-size:9px;font-weight:700;color:#00bfa5;letter-spacing:.04em}
.hdr-badge{display:flex;align-items:center;gap:4px;background:#eafaf1;border:1.5px solid rgba(0,191,165,.15);border-radius:18px;padding:4px 10px}
.hdr-badge span{font-size:13px;font-weight:800;color:#009688;font-family:'JetBrains Mono',monospace}
.page{display:flex;flex-direction:column;align-items:center;padding:16px 20px 28px;min-height:calc(100vh - 58px);justify-content:center}

/* Home */
.hero{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px;color:#1a3a2f}
.hero-p{font-size:13px;color:#6b9b8a;text-align:center;line-height:1.6;margin-bottom:20px}
.hero-p b{color:#009688}
.guide{width:100%;display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;border:1.5px solid #edf0f4;padding:14px 18px;margin-bottom:20px}
.guide-card{flex:1;display:flex;align-items:center;gap:10px}
.guide-title{font-size:13px;font-weight:800;color:#1a3a2f}
.guide-tag{font-size:9px;font-weight:600;color:#6b9b8a;margin-left:3px}
.guide-sub{font-size:10px;color:#94a3b3;font-weight:600}
.guide-sep{width:1px;align-self:stretch;background:#edf0f4}
.cta{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(140deg,#00bfa5,#009688);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,191,165,.25);font-family:'DM Sans',sans-serif;animation:pulse 2.5s ease-in-out infinite;transition:transform .15s}
.cta:active{transform:scale(.96)}
.cta:disabled{opacity:.3;cursor:not-allowed;animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

/* Play */
.reward-label{font-size:10px;font-weight:700;color:#94a3b3;text-transform:uppercase;letter-spacing:.08em}
.reward-big{font-size:52px;font-weight:900;color:#009688;font-family:'JetBrains Mono',monospace;line-height:1;transition:color .3s}
.reward-big.lost{color:#e74c3c}
.reward-next{font-size:11px;font-weight:600;color:#bcc5cf;margin-top:2px}

/* Coin 3D */
.coin-stage{width:180px;height:180px;perspective:900px;margin-bottom:20px}
.coin-flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .3s ease-out}
.coin-flip.spinning{transition:none}
.coin-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.coin-back{transform:rotateY(180deg)}

.side-tag{font-size:14px;font-weight:800;color:#1a3a2f;padding:5px 20px;background:#fff;border-radius:20px;border:1.5px solid #edf0f4;margin-bottom:16px;animation:pop .25s ease-out}

/* Pick buttons */
.picks{display:flex;gap:12px;width:100%;max-width:320px;animation:up .25s ease-out}
.pick-cara,.pick-cruz{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 12px;border-radius:14px;border:2px solid;cursor:pointer;font-family:'DM Sans',sans-serif;transition:transform .12s}
.pick-cara{border-color:rgba(212,160,23,.3);background:linear-gradient(180deg,#fffcf0,#fff3d4)}
.pick-cruz{border-color:rgba(144,164,174,.3);background:linear-gradient(180deg,#f5f8fa,#e8eef2)}
.pick-cara:active,.pick-cruz:active{transform:scale(.95)}
.pick-n{font-size:14px;font-weight:900;color:#1a3a2f}
.pick-s{font-size:9px;font-weight:600;color:#6b9b8a}

.stop-link{margin-top:16px;padding:10px 24px;border-radius:12px;border:none;background:transparent;color:#e67e22;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:underline;text-underline-offset:3px}

/* Wrong state */
.wrong-wrap{width:100%;max-width:320px;animation:up .3s ease-out}
.revive-btn{width:100%;padding:15px;border-radius:13px;border:none;margin-bottom:8px;background:linear-gradient(140deg,#00bfa5,#009688);color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 3px 14px rgba(0,191,165,.25)}
.revive-btn:active{transform:scale(.96)}
.giveup-btn{width:100%;padding:12px;border-radius:13px;border:1.5px solid #e0e5ea;background:#fff;color:#64748b;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.giveup-btn:active{transform:scale(.96)}

/* Result */
.res-title{font-size:24px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#00bfa5,#009688);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.res-amt{font-size:56px;font-weight:900;color:#009688;font-family:'JetBrains Mono',monospace;line-height:1}
.res-label{font-size:15px;font-weight:700;color:#6b9b8a;margin-top:4px}
.res-sub{font-size:13px;font-weight:700;color:#b0bac5;margin-top:8px}
.res-lost{font-size:16px;font-weight:700;color:#e74c3c;margin-bottom:8px}
.res-consolation{font-size:13px;font-weight:700;color:#94a3b3;padding:8px 16px;border-radius:10px;background:#f1f4f8;margin-bottom:16px}
.ghost-btn{width:100%;padding:16px;border-radius:14px;border:1.5px solid #e0e5ea;background:#fff;color:#64748b;font-size:16px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}

/* Toast */
.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:10;padding:8px 20px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.08);white-space:nowrap;animation:toastIn .3s ease-out}
.toast.win{background:#eafaf1;color:#009688;border:1.5px solid rgba(0,191,165,.2)}
.toast.shield{background:#ebf5fb;color:#2471a3;border:1.5px solid rgba(52,152,219,.2)}
.toast.lose{background:#fff5f5;color:#c0392b;border:1.5px solid #fec8c8}

/* Confetti */
.confetti{position:absolute;top:-4%;border-radius:2px;animation:confettiFall ease-in forwards}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeIn .2s}
.ad-box{width:78%;max-width:300px;padding:36px 24px;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:12px}
.ad-spin{width:32px;height:32px;border-radius:50%;border:3px solid #edf0f4;border-top-color:#00bfa5;animation:spin 1.2s linear infinite}
.ad-bar-bg{width:80%;height:4px;border-radius:2px;background:#edf0f4;overflow:hidden}
.ad-bar-fg{height:100%;border-radius:2px;background:linear-gradient(90deg,#00bfa5,#009688);transition:width .08s linear}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}65%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(500px) rotate(720deg);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes wrongPulse{0%,100%{background:#fff5f5}50%{background:#ffe8e8}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="hdr">
  <div class="hdr-l"><div class="hdr-ico">🪙</div><div><div class="hdr-t">Coin Flip</div><div class="hdr-sub">by StepPot</div></div></div>
  <div class="hdr-badge"><span style="font-size:12px">🎟️</span><span id="totalTk">0</span></div>
</div>
<div id="screenHome" class="page" style="animation:up .45s ease-out">
  <div style="animation:float 3s ease-in-out infinite;margin:20px 0 18px" id="homeCoin"></div>
  <h1 class="hero">Double or Nothing</h1>
  <p class="hero-p">Flip the coin & guess right to <b>double</b> your tickets.<br>You can stop and collect anytime!</p>
  <div class="guide">
    <div class="guide-card"><div id="guideCara"></div><div><div class="guide-title">CARA <span class="guide-tag">Heads</span></div><div class="guide-sub">Front side</div></div></div>
    <div class="guide-sep"></div>
    <div class="guide-card"><div id="guideCruz"></div><div><div class="guide-title">CRUZ <span class="guide-tag">Tails</span></div><div class="guide-sub">Back side</div></div></div>
  </div>
  <button class="cta" id="startBtn" onclick="handleStart()">▶ Free Play (3/3)</button>
</div>

<div id="screenPlay" class="page" style="display:none;justify-content:center;min-height:calc(100vh - 58px);position:relative">
  <div id="toastEl" class="toast" style="display:none"></div>
  <div style="text-align:center;margin-bottom:20px" id="rewardWrap">
    <div class="reward-label">TICKETS</div>
    <div class="reward-big" id="rewardNum">0</div>
    <div class="reward-next" id="rewardNext"></div>
  </div>
  <div style="margin-bottom:20px" id="coinShake">
    <div class="coin-stage"><div class="coin-flip" id="coinFlip"><div class="coin-face" id="coinFront"></div><div class="coin-face coin-back" id="coinBackFace"></div></div></div>
  </div>
  <div id="suspenseText" style="font-size:14px;font-weight:700;color:#94a3b3;margin-bottom:12px;height:22px;letter-spacing:.1em;display:none"></div>
  <div id="sideTag" class="side-tag" style="display:none"></div>
  <div id="wrongWrap" class="wrong-wrap" style="display:none">
    <button class="revive-btn" id="reviveBtn" onclick="handleRevive()"></button>
    <button class="giveup-btn" id="giveupBtn" onclick="handleGiveUp()"></button>
  </div>
  <div id="picksWrap" class="picks">
    <button class="pick-cara" onclick="flipCoin('cara')"><div id="pickCoinCara"></div><div><div class="pick-n">CARA</div><div class="pick-s">Heads</div></div></button>
    <button class="pick-cruz" onclick="flipCoin('cruz')"><div id="pickCoinCruz"></div><div><div class="pick-n">CRUZ</div><div class="pick-s">Tails</div></div></button>
  </div>
  <button class="stop-link" id="stopBtn" style="display:none" onclick="doStop()">✋ Stop & collect</button>
  <div id="bonusHint" style="margin-top:12px;font-size:11px;font-weight:600;color:#8ebadb;letter-spacing:.02em;display:none">🎁 Bonus Chance ready</div>
</div>

<div id="screenResult" class="page" style="display:none;justify-content:center;min-height:calc(100vh - 58px);position:relative">
  <div style="animation:pop .5s ease-out;text-align:center;z-index:6" id="resContent"></div>
</div>

<div id="confettiWrap" style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:5;display:none"></div>
<div class="overlay" id="adOverlay" style="display:none"><div class="ad-box"><div class="ad-spin"></div><div style="font-size:12px;font-weight:700;color:#64748b">Playing ad…</div><div class="ad-bar-bg"><div class="ad-bar-fg" id="adBar" style="width:0%"></div></div></div></div>
</div>

<script>
var MAX_REWARD=1024,DAILY_PLAYS=3,MAX_REVIVES=1;
var G={screen:'home',streak:0,reward:0,flipNum:0,hasBonus:true,isFlipping:false,flipAngle:0,coinResult:null,
  playsUsed:0,totalEarned:0,revivesUsed:0,wrongState:false,justRevived:false,adCb:null};

// Peso coin SVG
function pesoCoin(side,size){
  var c=side==='cara';
  var u=side+size+Math.random().toString(36).slice(2,6);
  var col=c?{o:'#D4A017',m:'#FFD54F',i:'#FFF176',t:'rgba(120,75,0,.55)',tl:'rgba(120,75,0,.35)'}
    :{o:'#7B8A99',m:'#B0BEC5',i:'#CFD8DC',t:'rgba(40,55,70,.55)',tl:'rgba(40,55,70,.35)'};
  var dots='';for(var i=0;i<36;i++){var a=i*10*Math.PI/180;dots+='<circle cx="'+(100+86*Math.cos(a))+'" cy="'+(98+86*Math.sin(a))+'" r="1.3" fill="'+col.tl+'"/>';}
  var inner=c?
    '<circle cx="100" cy="62" r="20" fill="'+col.tl+'"/><ellipse cx="100" cy="78" rx="18" ry="10" fill="'+col.tl+'"/>'+
    '<path d="M74 88Q80 76 100 76Q120 76 126 88L132 105Q100 100 68 105Z" fill="'+col.tl+'"/>'+
    '<text x="100" y="130" text-anchor="middle" font-size="16" font-weight="900" fill="'+col.t+'" font-family="sans-serif" letter-spacing="2">1 PISO</text>'+
    '<text x="100" y="158" text-anchor="middle" font-size="18" font-weight="900" fill="'+col.t+'" font-family="sans-serif" letter-spacing="4">CARA</text>'+
    '<path id="a'+u+'" d="M40 98 A60 60 0 0 1 160 98" fill="none"/>'+
    '<text text-anchor="middle" font-size="9" font-weight="700" fill="'+col.tl+'" font-family="serif" letter-spacing="2"><textPath href="#a'+u+'" startOffset="50%">REPUBLIKA NG PILIPINAS</textPath></text>'
    :
    (function(){var p='';[0,45,90,135,180,225,270,315].forEach(function(ang){var r=ang*Math.PI/180;p+='<ellipse cx="'+(100+22*Math.cos(r))+'" cy="'+(75+22*Math.sin(r))+'" rx="12" ry="7" transform="rotate('+ang+','+(100+22*Math.cos(r))+','+(75+22*Math.sin(r))+')" fill="'+col.tl+'"/>';});return p})()
    +'<circle cx="100" cy="75" r="10" fill="'+col.t+'" opacity=".4"/>'+
    '<text x="100" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="'+col.tl+'" font-family="serif" letter-spacing="2">BANGKO SENTRAL</text>'+
    '<text x="100" y="158" text-anchor="middle" font-size="18" font-weight="900" fill="'+col.t+'" font-family="sans-serif" letter-spacing="4">CRUZ</text>'+
    '<path id="b'+u+'" d="M40 98 A60 60 0 0 1 160 98" fill="none"/>'+
    '<text text-anchor="middle" font-size="8" font-weight="600" fill="'+col.tl+'" font-family="serif" letter-spacing="1.5"><textPath href="#b'+u+'" startOffset="50%">NG PILIPINAS • 2025</textPath></text>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 200 200" style="display:block"><defs><radialGradient id="g'+u+'" cx="38%" cy="30%" r="65%"><stop offset="0%" stop-color="'+col.i+'"/><stop offset="50%" stop-color="'+col.m+'"/><stop offset="100%" stop-color="'+col.o+'"/></radialGradient></defs><circle cx="100" cy="102" r="94" fill="rgba(0,0,0,.12)"/><circle cx="100" cy="98" r="96" fill="url(#g'+u+')"/><circle cx="100" cy="98" r="92" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/><circle cx="100" cy="98" r="78" fill="none" stroke="'+col.tl+'" stroke-width=".8"/>'+dots+'<g>'+inner+'</g></svg>';
}

// Init coins
document.getElementById('homeCoin').innerHTML=pesoCoin('cara',120);
document.getElementById('guideCara').innerHTML=pesoCoin('cara',40);
document.getElementById('guideCruz').innerHTML=pesoCoin('cruz',40);
document.getElementById('coinFront').innerHTML=pesoCoin('cara',170);
document.getElementById('coinBackFace').innerHTML=pesoCoin('cruz',170);
document.getElementById('pickCoinCara').innerHTML=pesoCoin('cara',28);
document.getElementById('pickCoinCruz').innerHTML=pesoCoin('cruz',28);

function show(id){document.getElementById(id).style.display='';}
function hide(id){document.getElementById(id).style.display='none';}
function showScreen(s){hide('screenHome');hide('screenPlay');hide('screenResult');show('screen'+s.charAt(0).toUpperCase()+s.slice(1));G.screen=s;}

function showToast(text,type,dur){
  var el=document.getElementById('toastEl');el.textContent=text;el.className='toast '+type;el.style.display='';el.style.animation='none';void el.offsetWidth;el.style.animation='toastIn .3s ease-out';
  setTimeout(function(){el.style.display='none'},dur||1500);
}
function spawnConfetti(){
  var w=document.getElementById('confettiWrap');w.innerHTML='';w.style.display='';
  var cols=['#00bfa5','#ffd700','#ff6b6b','#3498db','#f39c12','#e056a0','#9b59b6'];
  for(var i=0;i<25;i++){var d=document.createElement('div');d.className='confetti';var sz=5+Math.random()*7;d.style.cssText='left:'+Math.random()*100+'%;width:'+sz+'px;height:'+(sz*(i%3===0?1:2))+'px;background:'+cols[i%7]+';border-radius:'+(i%3===0?'50%':'2px')+';animation-duration:'+(0.8+Math.random()*1)+'s;animation-delay:'+Math.random()*0.5+'s';w.appendChild(d);}
  setTimeout(function(){w.style.display='none'},2500);
}

// ==================== AD SYSTEM ====================
// In production: calls native AdMob via postMessage
// Native side should call window.onAdComplete() when ad finishes
function runAd(cb){
  G.adCb=cb;
  // === PRODUCTION: uncomment below ===
  // if(window.ReactNativeWebView){
  //   window.ReactNativeWebView.postMessage(JSON.stringify({type:'AD_REQUEST'}));
  //   return;
  // }
  // === DEMO FALLBACK: fake ad ===
  show('adOverlay');var bar=document.getElementById('adBar');bar.style.width='0%';var p=0;
  var iv=setInterval(function(){p+=3;bar.style.width=p+'%';if(p>=100){clearInterval(iv);setTimeout(function(){hide('adOverlay');if(G.adCb)G.adCb()},200)}},55);
}
// Called from native after ad completes
window.onAdComplete=function(){hide('adOverlay');if(G.adCb)G.adCb();};
// Listen for messages from RN
document.addEventListener('message',function(e){try{var d=JSON.parse(e.data);if(d.type==='AD_COMPLETE')window.onAdComplete();}catch(ex){}});
window.addEventListener('message',function(e){try{var d=JSON.parse(e.data);if(d.type==='AD_COMPLETE')window.onAdComplete();}catch(ex){}});

function updateUI(){
  document.getElementById('totalTk').textContent=G.totalEarned;
  document.getElementById('rewardNum').textContent=G.reward;
  document.getElementById('rewardNum').className='reward-big'+(G.wrongState?' lost':'');
  var nxt=document.getElementById('rewardNext');
  if(G.reward>0&&!G.wrongState)nxt.textContent='next: '+Math.min(G.reward*2,MAX_REWARD);else nxt.textContent='';
  var stopBtn=document.getElementById('stopBtn');
  var justRevived=G.revivesUsed>0&&G.justRevived;
  stopBtn.style.display=(G.reward>0&&!G.isFlipping&&!G.wrongState&&!justRevived)?'':'none';
  stopBtn.textContent='✋ Stop & collect '+G.reward+' tickets';
  document.getElementById('bonusHint').style.display=(G.hasBonus&&G.flipNum===0&&!G.wrongState)?'':'none';
}

function resetGame(){
  G.streak=0;G.reward=0;G.flipNum=0;G.hasBonus=true;G.isFlipping=false;G.flipAngle=0;G.coinResult=null;G.revivesUsed=0;G.wrongState=false;G.justRevived=false;
  document.getElementById('coinFlip').style.transform='rotateY(0deg)';
}

function handleStart(){
  var left=DAILY_PLAYS-G.playsUsed;if(left<=0)return;
  resetGame();G.playsUsed++;showScreen('play');updateUI();showPicks();
  updateStartBtn();
}
function updateStartBtn(){
  var left=DAILY_PLAYS-G.playsUsed;var btn=document.getElementById('startBtn');
  if(left<=0){btn.textContent='No Plays Left (0/'+DAILY_PLAYS+')';btn.disabled=true;}
  else btn.textContent='▶ Play ('+left+'/'+DAILY_PLAYS+')';
}

function showPicks(){show('picksWrap');hide('wrongWrap');hide('sideTag');hide('suspenseText');updateUI();}
function hidePicks(){hide('picksWrap');}

var flipIv=null;
function flipCoin(choice){
  if(G.isFlipping||G.wrongState)return;
  G.isFlipping=true;G.coinResult=null;hidePicks();hide('stopBtn');hide('bonusHint');
  var curFlip=G.flipNum;G.flipNum++;
  var cf=document.getElementById('coinFlip');cf.classList.add('spinning');
  var a=G.flipAngle;
  flipIv=setInterval(function(){a+=28;G.flipAngle=a;cf.style.transform='rotateY('+a+'deg)'},16);
  var st=document.getElementById('suspenseText');
  setTimeout(function(){st.textContent='· · ·';st.style.display='';st.style.animation='blink .6s ease-in-out infinite'},500);
  setTimeout(function(){if(flipIv)clearInterval(flipIv);var sa=a;flipIv=setInterval(function(){sa+=6;G.flipAngle=sa;cf.style.transform='rotateY('+sa+'deg)'},16);st.textContent='Cara o Cruz?'},1100);
  setTimeout(function(){if(flipIv)clearInterval(flipIv);st.textContent='· · ·'},1800);
  setTimeout(function(){
    var res=Math.random()<.5?'cara':'cruz';var won=res===choice;
    var cur=G.flipAngle;var base=Math.ceil(cur/360)*360;
    var final=res==='cara'?base:base+180;
    G.coinResult=res;G.flipAngle=final;cf.classList.remove('spinning');cf.style.transform='rotateY('+final+'deg)';
    G.isFlipping=false;hide('suspenseText');
    setTimeout(function(){
      var tag=document.getElementById('sideTag');tag.textContent=res==='cara'?'👑 CARA':'🌸 CRUZ';tag.style.display='';tag.style.animation='none';void tag.offsetWidth;tag.style.animation='pop .25s ease-out';
      setTimeout(function(){
        if(won){
          G.streak++;G.reward=G.streak===1?2:G.reward*2;G.justRevived=false;
          showToast('+'+(G.streak===1?2:G.reward/2)+' → '+G.reward+' 🎟️','win',1200);
          var rw=document.getElementById('rewardWrap');rw.style.animation='bump .35s ease-out';setTimeout(function(){rw.style.animation='none'},400);
          updateUI();
          if(G.reward>=MAX_REWARD){spawnConfetti();setTimeout(function(){G.totalEarned+=G.reward;showResult(false)},1800);}
          else setTimeout(showPicks,600);
        }else{
          document.getElementById('coinShake').style.animation='shakeX .4s ease-in-out';setTimeout(function(){document.getElementById('coinShake').style.animation=''},400);
          if(G.hasBonus&&curFlip===0){G.hasBonus=false;showToast('🎁 Bonus Chance! One more try!','shield',1800);setTimeout(showPicks,1200);}
          else{
            var left=MAX_REVIVES-G.revivesUsed;
            if(left>0){G.wrongState=true;updateUI();show('wrongWrap');
              document.getElementById('reviveBtn').textContent='📺 Watch Ad & Continue';
              document.getElementById('giveupBtn').textContent='Give Up';
              document.getElementById('screenPlay').style.animation='wrongPulse 1.5s ease-in-out infinite';
            }else{setTimeout(function(){runAd(function(){G.totalEarned+=1;showResult(true)})},500);}
          }
        }
      },300);
    },200);
  },2400);
}

function handleRevive(){
  runAd(function(){G.revivesUsed++;G.wrongState=false;G.coinResult=null;G.justRevived=true;
    document.getElementById('screenPlay').style.animation='';updateUI();showPicks();});
}
function handleGiveUp(){G.wrongState=false;document.getElementById('screenPlay').style.animation='';runAd(function(){G.totalEarned+=1;showResult(true);});}

function doStop(){runAd(function(){G.totalEarned+=G.reward;spawnConfetti();showResult(false);});}

function showResult(lost){
  var h='';
  if(!lost){
    h='<div style="font-size:56px;margin-bottom:8px">🎊</div><h2 class="res-title">Nice!</h2><div class="res-amt">'+G.reward+'</div><div class="res-label">🎟️ tickets earned</div>';
    if(G.streak>0)h+='<div class="res-sub">'+G.streak+'-win streak 🔥</div>';
  }else{
    var lostAmt=G.reward;
    h='<div style="font-size:56px;margin-bottom:8px">'+(lostAmt>0?'😱':'🪙')+'</div>';
    h+='<h2 style="font-size:24px;font-weight:900;margin-bottom:8px;color:'+(lostAmt>0?'#c0392b':'#64748b')+'">'+(lostAmt>0?'So close!':'Better luck next time!')+'</h2>';
    h+='<div class="res-consolation">+1 🎟️ bonus ticket</div>';
  }
  var left=DAILY_PLAYS-G.playsUsed;
  h+='<div style="display:flex;gap:10px;margin-top:24px;width:100%">';
  if(left>0)h+='<button onclick="playAgain()" class="cta" style="flex:1;margin-bottom:0;animation:none">Play Again</button>';
  h+='<button onclick="goHome()" class="ghost-btn" style="flex:1">Done</button>';
  h+='</div>';
  document.getElementById('resContent').innerHTML=h;
  showScreen('result');updateStartBtn();
  document.getElementById('totalTk').textContent=G.totalEarned;
}

function playAgain(){var left=DAILY_PLAYS-G.playsUsed;if(left<=0)return;resetGame();G.playsUsed++;showScreen('play');updateUI();showPicks();updateStartBtn();}
function goHome(){showScreen('home');resetGame();updateStartBtn();document.getElementById('totalTk').textContent=G.totalEarned;}

updateStartBtn();
</script>
</body>
</html>
