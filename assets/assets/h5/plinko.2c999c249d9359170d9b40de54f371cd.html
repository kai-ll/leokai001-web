<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Plinko — StepPot</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100dvh;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:#F0FAF5;color:#1B2E4A}
.root{width:100%;max-width:420px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1B2E4A;border-radius:0 0 20px 20px;z-index:2;flex-shrink:0}
.hl{display:flex;align-items:center;gap:10px}
.hi{width:34px;height:34px;border-radius:11px;background:#A855F7;display:flex;align-items:center;justify-content:center;font-size:16px}
.hn{font-family:Fredoka;font-size:20px;font-weight:700;color:#fff}
.tp{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:18px;background:rgba(255,184,0,.15);border:1.5px solid rgba(255,184,0,.3);font-family:Fredoka;font-weight:700;font-size:14px;color:#FFB800}
.nfo{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin:8px 12px 0;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(27,46,74,.08);flex-shrink:0}
.nl{display:flex;align-items:baseline;gap:5px;font-family:Fredoka}
.nlb{font-size:12px;color:#5A7388}.nn{font-size:26px;font-weight:700;color:#9A6800}.nu{font-size:12px;color:#5A7388;font-weight:600}
.nr{display:flex;align-items:center;gap:6px}
.dlb{font-size:11px;color:#8DA4B8;font-weight:600}
.dds{display:flex;gap:5px}
.dd{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;border:2px solid;font-family:Fredoka;font-size:10px;font-weight:700}
.ddd{background:rgba(62,207,160,.12);border-color:#3ECFA0;color:#1AA673}
.ddn{background:rgba(255,184,0,.1);border-color:#FFB800;color:#E09800}
.dde{background:rgba(27,46,74,.04);border-color:rgba(27,46,74,.1)}
.cw{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 10px;min-height:0}
canvas{border-radius:16px;display:block;touch-action:none;box-shadow:0 2px 12px rgba(27,46,74,.08)}
.bot{padding:4px 14px 14px;flex-shrink:0}
.chips{display:flex;justify-content:center;gap:6px;margin-bottom:4px}
.chip{padding:4px 12px;border-radius:14px;background:rgba(62,207,160,.1);border:1px solid rgba(62,207,160,.2);font-family:Fredoka;font-size:13px;font-weight:700;color:#1AA673}
.hint{text-align:center;font-size:12px;color:#5A7388;font-weight:700;min-height:18px}
.ov{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:rgba(240,250,245,.92);backdrop-filter:blur(12px);animation:fi .4s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.ov-e{font-size:52px;margin-bottom:12px}.ov-t{font-family:Fredoka;font-weight:700;margin-bottom:6px}
.ov-s{font-size:13px;color:#5A7388;line-height:1.5;max-width:280px;margin-bottom:14px}
.btn{width:100%;padding:14px;border:none;border-radius:16px;font-family:Fredoka;font-size:16px;font-weight:700;cursor:pointer;color:#fff;max-width:300px}
.btn:active{transform:scale(.96)}
.bp{background:linear-gradient(135deg,#3ECFA0,#1AA673)}
.wb{background:#fff;border-radius:18px;padding:16px;margin-bottom:18px;width:100%;max-width:300px;border:1.5px solid rgba(62,207,160,.15);text-align:left}
.wt{font-family:Fredoka;font-size:14px;font-weight:600;color:#1AA673;margin-bottom:10px}
.wr{font-size:12px;color:#5A7388;line-height:1.4;padding:5px 0;display:flex;gap:8px}
.rb{background:#fff;border-radius:14px;padding:14px;margin-bottom:18px;width:100%;max-width:260px;border:1.5px solid rgba(62,207,160,.1)}
.rr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.rl{color:#5A7388}.rv{font-weight:700;color:#1AA673}
.rt{display:flex;justify-content:space-between;padding-top:8px;margin-top:5px;border-top:1px solid rgba(62,207,160,.1);font-size:15px;font-weight:700}
.rtl{color:#1B2E4A}.rtv{color:#9A6800}
.ao{position:absolute;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(27,46,74,.95);font-family:Fredoka}
.al{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:2px;margin-bottom:12px}
.at{font-size:18px;color:#fff;margin-bottom:16px}
.ab{width:200px;height:5px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.af{height:100%;border-radius:4px;background:#3ECFA0;animation:ap 1.5s linear}
@keyframes ap{from{width:0}to{width:100%}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="root">
  <div class="hdr"><div class="hl"><div class="hi">🎱</div><span class="hn">Plinko</span></div><div class="tp">🎟️ <span id="tk">0</span></div></div>
  <div class="nfo"><div class="nl"><span class="nlb">Total</span><span class="nn" id="tot">0</span><span class="nu">tickets</span></div><div class="nr"><span class="dlb">Drop</span><div class="dds" id="dots"></div></div></div>
  <div class="cw" id="cw"><canvas id="cv"></canvas></div>
  <div class="bot"><div class="chips hidden" id="ch"></div><div class="hint" id="ht">🎱 Slide to aim, tap to drop!</div></div>

  <div class="ov" id="oW">
    <div class="ov-e">🎱</div><div class="ov-t" style="font-size:32px;color:#1AA673">PLINKO</div>
    <div class="ov-s">Drop the ball and collect tickets!</div>
    <div class="wb"><div class="wt">🎯 How to Play</div>
      <div class="wr"><span>👆</span><span>Slide to aim, tap to drop</span></div>
      <div class="wr"><span>📍</span><span>Ball bounces through pins into slots</span></div>
      <div class="wr"><span>⚡</span><span>Red = bouncer! Blue = warp!</span></div>
      <div class="wr"><span>🎟️</span><span>3 drops per game</span></div>
      <div class="wr"><span>📺</span><span>Watch 1 ad to claim tickets</span></div>
    </div>
    <button class="btn bp" onclick="startGame()">SUGOD NA! 🎱</button>
  </div>
  <div class="ov hidden" id="oR"></div>
  <div class="ao hidden" id="oA"><div class="al">REWARDED AD</div><div class="at">🎬 Watching Ad...</div><div class="ab"><div class="af"></div></div></div>
</div>

<script>
const cw=document.getElementById('cw'),cv=document.getElementById('cv'),cx=cv.getContext('2d');
const dpr=window.devicePixelRatio||1;
const rc=cw.getBoundingClientRect();
const W=Math.floor(rc.width),H=Math.floor(rc.height);
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
cx.scale(dpr,dpr);

// ===== CONFIG =====
const ROWS=16,DROPS=3,SLOTS=[5,3,1,0,0,0,0,1,3,5],SN=10;
const PR=Math.max(3,W*.009);       // pin radius
const BR=Math.max(6,W*.018);       // ball radius
const GRAV=0.022;                   // gentle
const BOUNCINESS=0.35;
const FRIC=0.98;
const BOUNCER_N=18,WARP_N=12;
const STEPS=2;

const SH=Math.max(28,H*.048);      // slot height
const DZ=Math.max(36,H*.055);      // drop zone
const PT=DZ+4;                      // pin area top
const PB=H-SH-4;                   // pin area bottom
const RH=(PB-PT)/ROWS;             // row height

const VC={5:'#FFB800',3:'#f59e0b',1:'#fb923c',0:'#6366f1'};
const VB={5:'rgba(255,184,0,.18)',3:'rgba(245,158,11,.14)',1:'rgba(251,146,60,.1)',0:'rgba(99,102,241,.08)'};

let pins=[],slots=[],ball=null,phase='idle',dn=0,res=[],total=0,tix=0,lslot=-1,aimX=-1,touch=false,raf=0;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}

function mkPins(){
  const m=10,uw=W-m*2,sp=uw/(SN-1),p=[];
  for(let r=0;r<ROWS;r++){
    const even=r%2===0;
    const cols=even?SN:SN-1;
    const ox=even?m:m+sp/2;
    for(let c=0;c<cols;c++){
      p.push({x:ox+c*sp,y:PT+r*RH,r:PR,t:'n',row:r,gl:0});
    }
  }
  // Special pins (rows 2 to ROWS-2)
  const el=p.filter(q=>q.row>=2&&q.row<=ROWS-2),sh=shuffle(el);
  for(let i=0;i<BOUNCER_N+WARP_N&&i<sh.length;i++){
    if(i<BOUNCER_N){sh[i].t='b';sh[i].r=PR*1.6}
    else{sh[i].t='w';sh[i].r=PR*1.3}
  }
  return p;
}

function mkBall(x){return{x,y:DZ/2,vx:0,vy:0.5,r:BR,landed:false,slot:-1,frame:0,trail:[]}}

function step(b){
  if(b.landed)return;
  b.frame++;

  b.vy+=GRAV;
  b.vx*=FRIC;
  b.x+=b.vx;
  b.y+=b.vy;

  // Force minimum downward speed — anti-stall but slower
  if(b.vy<0.3&&b.y>PT&&b.y<PB-20)b.vy=0.3;

  // Hard anti-stuck: if ball hasn't progressed 20px in 120 frames, teleport down
  if(b.frame%120===0&&b.y<PB-50){b.y+=RH*2;b.vy=1;b.vx=(Math.random()-.5)*2}

  // Wall bounce — push INWARD strongly
  if(b.x<b.r+4){b.x=b.r+4;b.vx=Math.abs(b.vx)+0.8}
  if(b.x>W-b.r-4){b.x=W-b.r-4;b.vx=-(Math.abs(b.vx)+0.8)}

  // Pin collision
  for(let i=0;i<pins.length;i++){
    const p=pins[i];
    if(Math.abs(p.y-b.y)>RH*1.5)continue; // skip far pins
    const dx=b.x-p.x,dy=b.y-p.y;
    const dsq=dx*dx+dy*dy,md=b.r+p.r;
    if(dsq<md*md&&dsq>0.01){
      const d=Math.sqrt(dsq),nx=dx/d,ny=dy/d;
      // Save speed before collision
      const speedBefore=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      // Push out
      const overlap=md-d+1;
      b.x+=nx*overlap;
      b.y+=ny*overlap;

      if(p.t==='b'){
        // Bouncer: change direction but keep same speed
        const dir=b.x<W/2?1:-1;
        const ang=dir>0?-0.3:Math.PI+0.3; // slight downward angle
        b.vx=Math.cos(ang)*speedBefore*(0.8+Math.random()*0.2);
        b.vy=Math.max(0.3,Math.abs(Math.sin(ang)*speedBefore*0.5));
        p.gl=1;
      }else if(p.t==='w'){
        // Warp: teleport but keep same speed magnitude
        b.x=W*0.15+Math.random()*W*0.7;
        b.y=p.y+RH*0.8;
        b.vx=(Math.random()-.5)*speedBefore*0.3;
        b.vy=Math.max(0.3,speedBefore*0.7);
        p.gl=1;
      }else{
        const dot=b.vx*nx+b.vy*ny;
        b.vx-=2*dot*nx*BOUNCINESS;
        b.vy-=2*dot*ny*BOUNCINESS;
        b.vx+=(Math.random()-.5)*0.7;
        if(b.vy<0.3)b.vy=0.3;
      }
    }
  }

  // Trail
  b.trail.push({x:b.x,y:b.y,a:1});if(b.trail.length>14)b.trail.shift();

  // Landing
  const sw=(W-8)/SN;
  if(b.y+b.r>=PB){
    b.y=PB-b.r;b.vy=0;b.vx=0;b.landed=true;
    let si=0|((b.x-4)/sw);
    if(si<0)si=0;if(si>=SN)si=SN-1;
    b.slot=si;
  }
}

// ===== DRAW =====
function draw(){
  cx.clearRect(0,0,W,H);
  // Board bg
  cx.fillStyle='#fff';cx.beginPath();cx.roundRect(0,0,W,H,14);cx.fill();

  // Drop zone
  cx.fillStyle='rgba(62,207,160,.04)';cx.fillRect(0,0,W,DZ);
  cx.strokeStyle='rgba(62,207,160,.1)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(0,DZ);cx.lineTo(W,DZ);cx.stroke();

  // Rail dots
  const ry=DZ/2;
  for(let x=12;x<W-5;x+=12){cx.fillStyle='rgba(62,207,160,.1)';cx.beginPath();cx.arc(x,ry,1.5,0,Math.PI*2);cx.fill()}

  // Waiting ball (idle — static with clear text instruction)
  if(phase==='idle'&&dn<DROPS&&!ball&&aimX<0){
    // Static ball at center
    cx.fillStyle='rgba(255,184,0,.25)';cx.beginPath();cx.arc(W/2,ry,BR,0,Math.PI*2);cx.fill();
    cx.strokeStyle='rgba(255,184,0,.35)';cx.lineWidth=1.5;cx.beginPath();cx.arc(W/2,ry,BR,0,Math.PI*2);cx.stroke();

    // Instruction text
    cx.fillStyle='rgba(27,46,74,.25)';cx.font='bold 11px Fredoka';cx.textAlign='center';
    cx.fillText('👆 Touch to choose drop position',W/2,ry+BR+16);
  }

  // Pins
  for(const p of pins){
    if(p.gl>0){p.gl-=.02;if(p.gl<0)p.gl=0}
    let c='rgba(62,207,160,.3)';
    if(p.t==='b'){c=p.gl>.2?'#FF6B7A':'rgba(255,71,87,.45)';if(p.gl>.2){cx.shadowColor='#FF4757';cx.shadowBlur=8}}
    else if(p.t==='w'){c=p.gl>.2?'#40DFFF':'rgba(0,210,255,.45)';if(p.gl>.2){cx.shadowColor='#00D2FF';cx.shadowBlur=8}}
    cx.fillStyle=c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
  }

  // Aim
  if(aimX>=0&&phase==='idle'&&dn<DROPS){
    cx.strokeStyle='rgba(255,184,0,.08)';cx.lineWidth=1;cx.setLineDash([3,4]);
    cx.beginPath();cx.moveTo(aimX,DZ);cx.lineTo(aimX,PB);cx.stroke();cx.setLineDash([]);
    cx.fillStyle='#FFB800';cx.shadowColor='#FFB800';cx.shadowBlur=6;
    cx.beginPath();cx.arc(aimX,ry,BR,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
    cx.fillStyle='rgba(255,255,255,.3)';cx.beginPath();cx.arc(aimX-BR*.2,ry-BR*.2,BR*.3,0,Math.PI*2);cx.fill();
    // Arrow
    cx.fillStyle='rgba(255,184,0,.3)';cx.beginPath();cx.moveTo(aimX,ry+BR+5);cx.lineTo(aimX-4,ry+BR+1);cx.lineTo(aimX+4,ry+BR+1);cx.fill();
    // "TAP" label
    cx.fillStyle='rgba(255,184,0,.5)';cx.font='bold 9px Fredoka';cx.textAlign='center';
    cx.fillText('TAP!',aimX,ry-BR-5);
  }

  // Slots
  const sw=(W-8)/SN;
  for(let i=0;i<SN;i++){
    const v=slots[i],x=4+i*sw,hit=lslot===i;
    cx.fillStyle=hit?(VC[v]||'#6366f1'):(VB[v]||'rgba(99,102,241,.08)');
    cx.beginPath();cx.roundRect(x+1,PB+2,sw-2,SH-3,6);cx.fill();
    if(hit){cx.shadowColor=VC[v];cx.shadowBlur=8;cx.fill();cx.shadowBlur=0}
    cx.fillStyle=hit?'#fff':(VC[v]||'#6366f1');
    cx.font=`bold ${Math.max(11,sw*.33)}px Fredoka`;cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(v===0?'💧':'+'+v,x+sw/2,PB+SH/2+1);
  }

  // Ball
  if(ball){
    for(let i=0;i<ball.trail.length;i++){
      const t=ball.trail[i];t.a-=.07;
      if(t.a>0){cx.globalAlpha=t.a*.2;cx.fillStyle='#FFB800';cx.beginPath();cx.arc(t.x,t.y,ball.r*t.a,0,Math.PI*2);cx.fill()}
    }
    cx.globalAlpha=1;
    cx.fillStyle='#FFB800';cx.shadowColor='#FFB800';cx.shadowBlur=8;
    cx.beginPath();cx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
    cx.fillStyle='rgba(255,255,255,.3)';cx.beginPath();cx.arc(ball.x-ball.r*.2,ball.y-ball.r*.2,ball.r*.3,0,Math.PI*2);cx.fill();
  }
}

// ===== LOOP =====
function loop(){
  if(ball&&!ball.landed){for(let s=0;s<STEPS;s++){step(ball);if(ball.landed)break}}
  draw();
  if(ball&&ball.landed&&phase==='play'){onLand();return}
  raf=requestAnimationFrame(loop);
}

function onLand(){
  lslot=ball.slot;const v=slots[ball.slot];
  res.push(v);total+=v;dn++;ui();draw();
  if(dn>=DROPS){
    setTimeout(()=>showAd(()=>{
      tix+=total;
      let e='👍',t='NICE!',tc='#1AA673',s='3 drops total';
      if(total>=10){e='🏆';t='JACKPOT!';tc='#FFB800';s='Malaking panalo!'}
      else if(total>=5){e='🔥';t='MAGALING!';tc='#FFB800';s='Nice drops!'}
      else if(total===0){e='😅';t='SAYANG!';tc='#FF4757';s='Bad luck...'}
      result(e,t,tc,s);
    }),600);
  }else{
    setTimeout(()=>{ball=null;lslot=-1;aimX=-1;phase='idle';ui();raf=requestAnimationFrame(loop)},500);
  }
}

// ===== UI =====
function ui(){
  document.getElementById('tot').textContent=total;
  document.getElementById('tk').textContent=tix;
  const dd=document.getElementById('dots');dd.innerHTML='';
  for(let i=0;i<3;i++){const d=document.createElement('div');d.className='dd ';
    if(i<dn){d.classList.add('ddd');d.textContent=res[i]}
    else if(i===dn&&phase==='idle'){d.classList.add('ddn');d.textContent='▼'}
    else d.classList.add('dde');dd.appendChild(d)}
  const c=document.getElementById('ch');
  if(res.length>0){c.classList.remove('hidden');c.innerHTML=res.map(r=>`<div class="chip">+${r}</div>`).join('')}
  else c.classList.add('hidden');
  const h=document.getElementById('ht');
  if(phase==='idle'&&dn===0)h.textContent='🎱 Slide to aim, tap to drop!';
  else if(phase==='idle'&&dn<DROPS)h.textContent=`Drop ${dn+1} of 3 — slide & tap!`;
  else if(phase==='play')h.textContent='⏬ Dropping...';
  else if(phase==='done')h.textContent='Game over!';
}
function sov(id){document.querySelectorAll('.ov,.ao').forEach(o=>o.classList.add('hidden'));if(id)document.getElementById(id).classList.remove('hidden')}
function showAd(cb){sov('oA');setTimeout(()=>{sov(null);cb()},1500)}
function result(em,ti,tc,su){
  phase='done';const o=document.getElementById('oR');
  o.innerHTML=`<div class="ov-e">${em}</div><div class="ov-t" style="font-size:32px;color:${tc}">${ti}</div><div class="ov-s">${su}</div>
    <div class="rb">${res.map((r,i)=>`<div class="rr"><span class="rl">Drop ${i+1}</span><span class="rv">+${r}</span></div>`).join('')}
    <div class="rt"><span class="rtl">Total</span><span class="rtv">+${total} 🎟️</span></div></div>
    <button class="btn bp" onclick="startGame()">Play Again! 🎱</button>`;
  sov('oR');ui();
}

// ===== TOUCH: slide to aim, tap/release to drop =====
function gx(e){
  const r=cv.getBoundingClientRect();
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  return Math.max(BR+6,Math.min(W-BR-6,(cx-r.left)*(W/r.width)));
}

let moved=false;
cv.addEventListener('pointerdown',e=>{
  if(phase!=='idle'||dn>=DROPS)return;
  e.preventDefault();touch=true;moved=false;
  aimX=gx(e);
  if(!raf)raf=requestAnimationFrame(loop);
});
cv.addEventListener('pointermove',e=>{
  if(!touch||phase!=='idle')return;
  e.preventDefault();moved=true;aimX=gx(e);
});
cv.addEventListener('pointerup',e=>{
  if(!touch||phase!=='idle'||dn>=DROPS)return;
  touch=false;
  const x=aimX>=0?aimX:W/2;
  ball=mkBall(x);phase='play';lslot=-1;aimX=-1;ui();
  if(!raf)raf=requestAnimationFrame(loop);
});
cv.addEventListener('pointerleave',e=>{
  if(!touch||phase!=='idle')return;
  touch=false;
  if(aimX>=0){ball=mkBall(aimX);phase='play';lslot=-1;aimX=-1;ui();if(!raf)raf=requestAnimationFrame(loop)}
});

function startGame(){
  if(raf){cancelAnimationFrame(raf);raf=0}
  pins=mkPins();slots=shuffle(SLOTS);ball=null;aimX=-1;
  phase='idle';dn=0;res=[];total=0;lslot=-1;touch=false;
  sov(null);ui();raf=requestAnimationFrame(loop);
}

pins=mkPins();slots=shuffle(SLOTS);ui();draw();
</script>
</body>
</html>
